<html>
    <head>
        <script>
            // SciChart's WebGPU auto-detection only enables itself on Apple Silicon (Mac) user agents/GPUs.
            // Force it on here so it attempts WebGPU on any adapter (e.g. NVIDIA/AMD/Intel on Windows/Linux),
            // as long as the browser actually supports the WebGPU API. Must run before the SciChart script loads,
            // since it reads this flag once at module init time.
            try {
                localStorage.setItem('IS_WEB_GPU', '1')
            } catch (e) {}
        </script>
        <script src="https://cdn.jsdelivr.net/npm/scichart@6.0.15/index.min.js" crossorigin="anonymous"></script>
        <style>
            body {
                margin: 0px;
            }

            #chart {
                width: 100vw;
                height: 100vh;
            }
        </style>
    </head>

    <body>
        <script src="common.js"></script>
        <div id="chart"></div>
        <script>
            const {
                SciChartSurface,
                SciChartDefaults,
                NumericAxis,
                EAutoRange,
                CursorModifier,
                ZoomPanModifier,
                ZoomExtentsModifier,
                MouseWheelZoomModifier,
                XyDataSeries,
                FastLineRenderableSeries,
                FastMountainRenderableSeries,
                SplineLineRenderableSeries,
                XyScatterRenderableSeries,
                EllipsePointMarker,
                NumberRange,
                SciChartJsNavyTheme,
                EAxisAlignment,
                LeftAlignedOuterVerticallyStackedAxisLayoutStrategy,
                EXyDirection,
                RubberBandXyZoomModifier,
                WebGpuHelper,
            } = SciChart

            SciChartDefaults.useNativeText = true
            SciChartSurface.configure({
                wasmUrl: 'https://cdn.jsdelivr.net/npm/scichart@6.0.15/_wasm/scichart.wasm',
            })

            window.testSetup().then(({ channels, dataSetSize, appendPointsPerSecond, appendTestDurationMs, feature, maxCapacityTest, maxCapacityChunkSize: configuredMaxCapacityChunkSize }) => {
                // Max data capacity mode (same rules for every library that runs it): data is generated and given to the
                // chart in chunks (one shot up to 10M points per channel, else maxCapacityChunkSize), waiting for a rendered
                // frame after each chunk and reporting progress, instead of generating the full data set up front.
                const maxCapacityChunkSize = dataSetSize <= 10_000_000 ? dataSetSize : configuredMaxCapacityChunkSize || 2_000_000
                const xs = maxCapacityTest ? undefined : new Float64Array(dataSetSize)
                if (!maxCapacityTest)
                for (let i = 0; i < dataSetSize; i += 1) {
                    xs[i] = i
                }
                const dataSetsY = maxCapacityTest ? undefined : new Array(channels).fill(0).map((_, ch) => {
                    // NOTE: Float64Array on purpose (x and y). SciChart v6's XyDataSeries.appendRange is typed
                    // `NumberArray = number[] | Float64Array` and stores values as doubles (SCRTDoubleVector), so Float64 is its
                    // native input. Float32Array y values are not supported
                    const ys = new Float64Array(dataSetSize)
                    let prev = 0
                    for (let i = 0; i < dataSetSize; i += 1) {
                        const next = prev + Math.random() * 2 - 1
                        prev = next
                        ys[i] = next
                    }
                    return ys
                })

                // NOTE: Some scichart js features do not support FiFo (first in first out), in which case data cleaning has to be handled manually by user
                const fifoSupported = feature !== 'spline'

                window.testPerform = async () => {
                    // loading speed test
                    const sciChart = await SciChartSurface.createSingle('chart', {
                        theme: new SciChartJsNavyTheme(),
                    })
                    const sciChartSurface = sciChart.sciChartSurface
                    const wasmContext = sciChart.wasmContext

                    console.log('SciChart render backend: ' + (WebGpuHelper.getWebGpuSupported() ? 'WebGPU' : 'WebGL'))

                    const xAxis = new NumericAxis(wasmContext)
                    sciChartSurface.xAxes.add(xAxis)
                    xAxis.autoRange = EAutoRange.Always
                    // Max capacity mode: X axis fixed to the full data range [0, dataSetSize] (same for every library, LCJS does the
                    // same). Then a library that drops or skips part of the data leaves an empty part of the chart, which the bench's
                    // render coverage check (bench/index.js) detects, instead of the axis silently fitting to whatever was kept.
                    if (maxCapacityTest) {
                        xAxis.autoRange = EAutoRange.Never
                        xAxis.visibleRange = new NumberRange(0, dataSetSize)
                    }
                    const yAxis = new NumericAxis(wasmContext)
                    sciChartSurface.yAxes.add(yAxis)
                    yAxis.autoRange = EAutoRange.Always

                    // const mouseWheelZoomModifier = new MouseWheelZoomModifier()
                    // const rubberBandZoomModifier = new RubberBandXyZoomModifier()
                    // const zoomExtentsModifier = new ZoomExtentsModifier()
                    // sciChartSurface.chartModifiers.add(zoomExtentsModifier)
                    // sciChartSurface.chartModifiers.add(rubberBandZoomModifier)
                    // sciChartSurface.chartModifiers.add(mouseWheelZoomModifier)

                    const dataSeriesList = []
                    const rendSeriesList = []
                    for (let ch = 0; ch < channels; ch += 1) {
                        const yMin = ch
                        const dataSeries = new XyDataSeries(wasmContext, {
                            dataIsSortedInX: true,
                            containsNaN: false,
                            fifoCapacity: fifoSupported ? dataSetSize : undefined,
                        })
                        const rendSeries =
                            feature === 'scatter'
                                ? new XyScatterRenderableSeries(wasmContext, {
                                      dataSeries,
                                      pointMarker: new EllipsePointMarker(wasmContext, {
                                          width: 3,
                                          height: 3,
                                          fill: 'steelblue',
                                      }),
                                  })
                                : feature === 'area'
                                  ? new FastMountainRenderableSeries(wasmContext, {
                                        dataSeries,
                                        strokeThickness: 2,
                                        zeroLineY: yMin,
                                    })
                                  : feature === 'spline'
                                    ? new SplineLineRenderableSeries(wasmContext, {
                                          dataSeries,
                                          strokeThickness: 2,
                                          interpolationPoints: 20,
                                      })
                                    : new FastLineRenderableSeries(wasmContext, {
                                          dataSeries,
                                          strokeThickness: 2,
                                          isDigitalLine: feature === 'step' ? true : false,
                                      })
                        sciChartSurface.renderableSeries.add(rendSeries)
                        dataSeriesList.push(dataSeries)
                        rendSeriesList.push(rendSeries)
                        if (maxCapacityTest) continue
                        dataSeries.appendRange(xs, dataSetsY[ch])
                        // SciChart v6's wasm engine can silently drop data on very large appendRange
                        // calls (observed: crashes with "table index is out of bounds" around 33M points
                        // per channel, and silently renders incomplete series above that with no error at
                        // all) - verify the full range actually landed so corrupted runs fail loudly
                        // instead of reporting false positive benchmark numbers.
                        if (dataSeries.count() !== dataSetSize) {
                            // console.error (not throw) so bench/index.js's existing error listener
                            // catches this immediately instead of waiting for the harness timeout -
                            // an uncaught throw here doesn't reach page.on('console'), only
                            // page.on('pageerror'), which the harness doesn't listen for.
                            console.error(
                                `SciChart data corruption detected: channel ${ch} has ${dataSeries.count()} points, expected ${dataSetSize}`,
                            )
                            return
                        }
                    }

                    if (maxCapacityTest) {
                        // SciChart specifics in max capacity mode (vs. LCJS / ChartGPU / uPlot):
                        // - data goes in with XyDataSeries.appendRange per channel, SciChart's own API for adding data.
                        // - x and y are Float64Array: appendRange takes number[] | Float64Array and stores doubles
                        //   (see the note at the top), Float32 y input is not supported.
                        // - "rendered" = sciChartSurface.rendered event (fires after each drawn frame; appendRange invalidates).
                        // - after input, every channel's point count is verified, because SciChart's wasm engine can silently
                        //   drop data at large sizes (see the note above). A short count fails the run.
                        const waitRendered = () =>
                            new Promise((resolve) => {
                                const handler = () => {
                                    sciChartSurface.rendered.unsubscribe(handler)
                                    resolve()
                                }
                                sciChartSurface.rendered.subscribe(handler)
                            })
                        const prev = new Array(channels).fill(0)
                        for (let start = 0; start < dataSetSize; start += maxCapacityChunkSize) {
                            const count = Math.min(maxCapacityChunkSize, dataSetSize - start)
                            const cx = new Float64Array(count)
                            for (let i = 0; i < count; i += 1) cx[i] = start + i
                            for (let ch = 0; ch < channels; ch += 1) {
                                const cy = new Float64Array(count)
                                let p = prev[ch]
                                for (let i = 0; i < count; i += 1) cy[i] = p = p + Math.random() * 2 - 1
                                prev[ch] = p
                                dataSeriesList[ch].appendRange(cx, cy)
                            }
                            await waitRendered()
                            if (window.maxCapacityInputProgress) window.maxCapacityInputProgress(start + count)
                        }
                        for (let ch = 0; ch < channels; ch += 1) {
                            if (dataSeriesList[ch].count() !== dataSetSize) {
                                console.error(
                                    `SciChart data corruption detected: channel ${ch} has ${dataSeriesList[ch].count()} points, expected ${dataSetSize}`,
                                )
                                return
                            }
                        }
                        window.loadingTestFinished(window.testStart, window.performance.now())
                        await new Promise((resolve) => setTimeout(resolve, 500))
                        window.appendTestFinished(window.performance.now(), -1)
                        return
                    }

                    const runAppendPerformanceTest = () => {
                        return new Promise((resolve) => {
                            const tStart = window.performance.now()
                            let frameCount = 0
                            let iSample = 0
                            let x = dataSetSize
                            let tPrev = window.performance.now()
                            let showData = true
                            const frame = () => {
                                frameCount += 1
                                const t = window.performance.now()
                                const d = t - tPrev
                                tPrev = t
                                const appendDataPointCount = Math.round((appendPointsPerSecond * d) / 1000)

                                // Append data implementation for SciChart
                                const dataAppend = new Array(channels)
                                    .fill(0)
                                    .map(() => [new Float64Array(appendDataPointCount), new Float64Array(appendDataPointCount)])
                                for (let i = 0; i < appendDataPointCount; i += 1) {
                                    x += 1
                                    iSample = (iSample + 1) % dataSetSize
                                    for (let ch = 0; ch < channels; ch += 1) {
                                        dataAppend[ch][0][i] = x
                                        dataAppend[ch][1][i] = dataSetsY[ch][iSample]
                                    }
                                }
                                for (let ch = 0; ch < channels; ch += 1) {
                                    dataSeriesList[ch].appendRange(dataAppend[ch][0], dataAppend[ch][1])
                                    if (!fifoSupported) {
                                        dataSeriesList[ch].removeRange(0, appendDataPointCount)
                                        xAxis.visibleRange = new NumberRange(x - dataSetSize, x)
                                    }
                                }

                                if (t - tStart > appendTestDurationMs) {
                                    const fps = (1000 * frameCount) / (t - tStart)
                                    window.appendTestFinished(window.performance.now(), fps)
                                    resolve()
                                } else {
                                    requestAnimationFrame(frame)
                                }
                            }
                            requestAnimationFrame(frame)
                        })
                    }

                    requestAnimationFrame(async () => {
                        window.loadingTestFinished(window.testStart, window.performance.now())

                        const rendSeries = rendSeriesList[0]
                        console.log(
                            rendSeries.resamplingMode,
                            rendSeries.resamplingPrecision,
                            rendSeries.getResamplingParams(),
                            rendSeries.getCurrentRenderPassData(),
                        )

                        await new Promise((resolve) => setTimeout(resolve, appendTestDurationMs === 0 ? 2000 : 500))
                        await runAppendPerformanceTest()
                    })
                }

                window.testReadyToBegin()
            })
        </script>
    </body>
</html>
