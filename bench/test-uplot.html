<html>
    <head>
        <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.min.css" rel="stylesheet" type="text/css" />
        <style>
            body {
                margin: 0px;
            }

            #chart {
                width: 100vw;
                height: 100vh;
            }
        </style>
    </head>

    <body>
        <div id="chart"></div>
        <script>
            const container = document.getElementById('chart')
            const bounds = container.getBoundingClientRect()
            const { linear, stepped, spline, spline2 } = uPlot.paths

            window.testSetup().then(({ channels, dataSetSize, appendPointsPerSecond, appendTestDurationMs, feature, maxCapacityTest, maxCapacityChunkSize: configuredMaxCapacityChunkSize }) => {
                // Max data capacity mode (same rules for every library that runs it): data is generated and given to the
                // chart in chunks (one shot up to 10M points per channel, else maxCapacityChunkSize), waiting for a rendered
                // frame after each chunk and reporting progress, instead of generating the full data set up front.
                const maxCapacityChunkSize = dataSetSize <= 10_000_000 ? dataSetSize : configuredMaxCapacityChunkSize || 2_000_000
                // NOTE: uplot real-time tests bug out after ~5 seconds, resulting in all graphs showing flat lines
                // Afterwards, FPS will be recorded to be much better than when the graphs are properly visible.
                // To workaround this issue, uplot real-time tests are limited to 5 seconds.
                appendTestDurationMs = Math.min(5000, appendTestDurationMs)

                // [x...], [y0...], [y1...], [y2...]
                const data = new Array(1 + channels).fill(0).map((_) => [])
                if (!maxCapacityTest) for (let x = 0; x < dataSetSize; x += 1) {
                    data[0].push(x)
                }
                if (!maxCapacityTest) for (let ch = 0; ch < channels; ch += 1) {
                    let prev = 0
                    for (let x = 0; x < dataSetSize; x += 1) {
                        const next = prev + Math.random() * 2 - 1
                        prev = next
                        data[1 + ch].push(next)
                    }
                }

                window.testPerform = () => {
                    const drawStyles = {
                        line: 0,
                        bars: 1,
                        points: 2,
                        barsLeft: 3,
                        barsRight: 4,
                    }
                    const lineInterpolations = {
                        linear: 0,
                        stepAfter: 1,
                        stepBefore: 2,
                        spline: 3,
                    }
                    const _stepBefore = stepped({ align: -1 })
                    const _stepAfter = stepped({ align: 1 })
                    const _linear = linear()
                    const _spline = spline()

                    function paths(u, seriesIdx, idx0, idx1, extendGap, buildClip) {
                        let s = u.series[seriesIdx]
                        let style = s.drawStyle
                        let interp = s.lineInterpolation

                        let renderer =
                            interp == lineInterpolations.stepAfter ? _stepAfter : interp == lineInterpolations.spline ? _spline : _linear

                        return renderer(u, seriesIdx, idx0, idx1, extendGap, buildClip)
                    }

                    function scatterPaths(u, seriesIdx, idx0, idx1) {
                        uPlot.orient(u, seriesIdx, (series, dataX, dataY, scaleX, scaleY, valToPosX, valToPosY, xOff, yOff, xDim, yDim) => {
                            const ctx = u.ctx
                            const rad = 2 * uPlot.pxRatio
                            ctx.save()
                            ctx.fillStyle = 'red'
                            ctx.strokeStyle = series.stroke(u, seriesIdx)
                            ctx.lineWidth = uPlot.pxRatio
                            let path = new Path2D()
                            let n = 0
                            const flush = () => {
                                ctx.fill(path)
                                ctx.stroke(path)
                                path = new Path2D()
                                n = 0
                            }
                            for (let i = idx0; i <= idx1; i++) {
                                if (dataY[i] == null) continue
                                const x = Math.round(valToPosX(dataX[i], scaleX, xDim, xOff))
                                const y = Math.round(valToPosY(dataY[i], scaleY, yDim, yOff))
                                path.moveTo(x + rad, y)
                                path.arc(x, y, rad, 0, 2 * Math.PI)
                                if (++n === 1000) flush()
                            }
                            if (n > 0) flush()
                            ctx.restore()
                        })
                        return null
                    }

                    const opts = {
                        width: bounds.width,
                        height: bounds.height,
                        series: [
                            {},
                            ...new Array(channels).fill(0).map((_, iChannel) => ({
                                width: feature === 'scatter' ? 0 : 2,
                                // Scatter: uPlot's built-in points renderer puts every point into ONE Path2D.
                                // Chrome 147 regressed badly on filling a Path2D with many arc sub-paths (40K arcs:
                                // 12 s vs 0.13 s on Chrome 136), which made uPlot scatter time out above ~15K points.
                                // Workaround: custom series paths (uPlot's documented approach for large scatter plots)
                                // drawing the same points (radius 2, red fill, transparent 1px stroke) in 1K-point chunks.
                                points: feature === 'scatter' ? { show: false } : false,
                                stroke: feature === 'scatter' ? 'rgba(0,0,0,0)' : `rgba(${iChannel * 20},0,0,1)`,
                                fill: feature === 'area' && 'rgba(255,0,0,0.1)',
                                lineInterpolation: null,
                                drawStyle: drawStyles.line,
                                lineInterpolation:
                                    feature === 'step'
                                        ? lineInterpolations.stepAfter
                                        : feature === 'spline'
                                        ? lineInterpolations.spline
                                        : lineInterpolations.linear,
                                paths: feature === 'scatter' ? scatterPaths : paths,
                            })),
                        ],
                        scales: {
                            x: {
                                // Numeric axis values instead of UNIX timestamp (default).
                                time: false,
                                // Max capacity mode: X axis fixed to the full data range [0, dataSetSize] (same for every library,
                                // LCJS does the same). Then a library that drops or skips part of the data leaves an empty part of
                                // the chart, which the bench's render coverage check (bench/index.js) detects.
                                auto: !maxCapacityTest,
                                ...(maxCapacityTest ? { range: [0, dataSetSize] } : {}),
                            },
                        },
                        legend: {
                            show: false,
                        },
                    }
                    const drawWaiters = []
                    opts.hooks = { draw: [() => drawWaiters.splice(0).forEach((resolve) => resolve())] }
                    uplot = new uPlot(opts, data, container)

                    if (maxCapacityTest) {
                        // uPlot specifics in max capacity mode (vs. LCJS / SciChart / ChartGPU):
                        // - uPlot has no append API. Its documented way to add data is setData() with the grown data arrays,
                        //   which re-processes and redraws all data given so far, so that is done after every chunk.
                        // - data stays in uPlot's own format (plain number arrays [x[], y0[], y1[], ...]), same as its load test.
                        // - "rendered" = uPlot's 'draw' hook (fires at the end of each redraw).
                        ;(async () => {
                            const prev = new Array(channels).fill(0)
                            for (let start = 0; start < dataSetSize; start += maxCapacityChunkSize) {
                                const count = Math.min(maxCapacityChunkSize, dataSetSize - start)
                                for (let i = 0; i < count; i += 1) data[0].push(start + i)
                                for (let ch = 0; ch < channels; ch += 1) {
                                    const ys = data[1 + ch]
                                    let p = prev[ch]
                                    for (let i = 0; i < count; i += 1) ys.push((p = p + Math.random() * 2 - 1))
                                    prev[ch] = p
                                }
                                const drawn = new Promise((resolve) => drawWaiters.push(resolve))
                                uplot.setData(data)
                                await drawn
                                if (window.maxCapacityInputProgress) window.maxCapacityInputProgress(start + count)
                            }
                            requestAnimationFrame(async () => {
                                window.loadingTestFinished(window.testStart, window.performance.now())
                                await new Promise((resolve) => setTimeout(resolve, 500))
                                window.appendTestFinished(window.performance.now(), -1)
                            })
                        })().catch((e) => {
                            console.error(String(e && (e.stack || e)))
                            if (window.error) window.error()
                        })
                        return
                    }

                    const runAppendPerformanceTest = () => {
                        return new Promise((resolve) => {
                            const tStart = window.performance.now()
                            let frameCount = 0
                            let iSample = 0
                            let x = dataSetSize
                            let tPrev = window.performance.now()

                            const frame = () => {
                                frameCount += 1
                                const t = window.performance.now()
                                const d = t - tPrev
                                tPrev = t
                                const appendDataPointCount = Math.round((appendPointsPerSecond * d) / 1000)
                                if (appendDataPointCount > 0) {
                                    // Append data implementation for uplot
                                    for (let i = 0; i < appendDataPointCount; i += 1) {
                                        x += 1
                                        data[0].shift()
                                        data[0].push(x)
                                        for (let ch = 0; ch < channels; ch += 1) {
                                            const y = data[1 + ch][0]
                                            data[1 + ch].shift()
                                            data[1 + ch].push(y)
                                        }
                                    }
                                    uplot.setData(data)
                                }
                                //

                                if (t - tStart > appendTestDurationMs) {
                                    const fps = (1000 * frameCount) / (t - tStart)
                                    window.appendTestFinished(window.performance.now(), fps)
                                    resolve()
                                } else {
                                    requestAnimationFrame(frame)
                                }
                            }
                            requestAnimationFrame(frame)
                        })
                    }

                    requestAnimationFrame(async () => {
                        window.loadingTestFinished(window.testStart, window.performance.now())
                        await new Promise((resolve) => setTimeout(resolve, 500))
                        await runAppendPerformanceTest()
                    })
                }

                window.testReadyToBegin()
            })
        </script>
    </body>
</html>
