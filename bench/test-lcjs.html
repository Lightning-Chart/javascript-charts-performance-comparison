<html>
    <head>
        <script src="lcjs.iife.js"></script>
        <style>
            body {
                margin: 0px;
            }

            #chart {
                width: 100vw;
                height: 100vh;
            }
        </style>
    </head>

    <body>
        <div id="chart"></div>
        <script src="common.js"></script>
        <script>
            const container = document.getElementById('chart')
            const {
                lightningChart,
                Themes,
                disableThemeEffects,
                AxisTickStrategies,
                SolidFill,
                ColorRGBA,
                AxisScrollStrategies,
                emptyLine,
                emptyFill,
                emptyTick,
                DataSet,
            } = lcjs

            window
                .testSetup()
                .then(
                    ({
                        channels,
                        dataSetSize,
                        appendPointsPerSecond,
                        testAppend,
                        appendTestDurationMs,
                        feature,
                        maxCapacityTest,
                        maxCapacityChunkSize: configuredMaxCapacityChunkSize,
                        disableTimeouts,
                    }) => {
                        const maxCapacityOneShotSize = 10_000_000
                        const maxCapacityChunkSize =
                            dataSetSize <= maxCapacityOneShotSize ? dataSetSize : configuredMaxCapacityChunkSize || 2_000_000
                        const createDataChunk = (start, count, previousYValues) => {
                            console.log('create chunk', start, count)
                            const xs = new Float64Array(new SharedArrayBuffer(count * Float64Array.BYTES_PER_ELEMENT))
                            for (let i = 0; i < count; i += 1) {
                                xs[i] = start + i
                            }
                            const ys = new Array(channels).fill(0).map((_, ch) => {
                                const values = new Float32Array(new SharedArrayBuffer(count * Float32Array.BYTES_PER_ELEMENT))
                                let prev = previousYValues[ch]
                                for (let i = 0; i < count; i += 1) {
                                    const next = prev + Math.random() * 2 - 1
                                    prev = next
                                    values[i] = next
                                }
                                previousYValues[ch] = prev
                                return values
                            })
                            return { xs, ys }
                        }
                        const createAppendSamples = (xs, ys) => ({
                            x: xs,
                            ...Object.fromEntries(new Array(channels).fill(0).map((_, i) => [`y${i}`, ys[i]])),
                        })
                        const fullData = maxCapacityTest ? undefined : createDataChunk(0, dataSetSize, new Array(channels).fill(0))
                        const xs = fullData && fullData.xs
                        const dataSetsY = fullData && fullData.ys

                        const theme = {
                            ...Themes.darkGold,
                            effect: undefined,
                            xAxisNumericTicks: Themes.darkGold.xAxisNumericTicks.setMinorTickStyle(emptyTick),
                            yAxisNumericTicks: Themes.darkGold.yAxisNumericTicks.setMinorTickStyle(emptyTick),
                        }

                        window.testPerform = () => {
                            // loading speed test
                            const lc = lightningChart({
                                // Put license key here to test locally
                                license: undefined,
                                webWorkers: {
                                    maxWorkers: appendPointsPerSecond > 0 && appendTestDurationMs > 0 ? 0 : undefined,
                                },
                                licenseInformation: {
                                    appTitle: 'LightningChart JS Trial',
                                    company: 'LightningChart Ltd.',
                                },
                            })

                            const chart = lc
                                .ChartXY({
                                    animationsEnabled: false,
                                    theme,
                                    container,
                                    interactable: false,
                                    legend: { visible: false },
                                })
                                .setTitle('')

                            const axisXBottom = chart
                                .getDefaultAxisX()
                                .setScrollStrategy(undefined)
                                .setInterval({ start: 0, end: dataSetSize, stopAxisAfter: true })

                            const chunkedMaxCapacityTest = maxCapacityTest && dataSetSize > maxCapacityOneShotSize
                            console.log('create ds', dataSetSize, channels)
                            const dataSet = new DataSet({
                                includesNaN: false,
                                useWasmMemory64: true,
                                useSharedArrayBuffers: true,
                                schema: {
                                    x: {
                                        pattern: feature === 'scatter' ? null : 'progressive',
                                        storage: Float64Array,
                                        ensureNoDuplication: !chunkedMaxCapacityTest,
                                    },
                                    ...Object.fromEntries(
                                        new Array(channels).fill(0).map((_, i) => [
                                            `y${i}`,
                                            {
                                                pattern: null,
                                                storage: Float32Array,
                                                ensureNoDuplication: !chunkedMaxCapacityTest,
                                            },
                                        ]),
                                    ),
                                },
                            }).setMaxSampleCount(dataSetSize)
                            if (!maxCapacityTest) {
                                dataSet.appendSamples(createAppendSamples(xs, dataSetsY))
                            }
                            const seriesList = []
                            for (let i = 0; i < channels; i += 1) {
                                const series = chart.addPointLineAreaSeries().setPointStrokeStyle(emptyLine)
                                series.setDataSet(dataSet, { x: 'x', y: `y${i}` })
                                if (feature === 'step') {
                                    series.setCurvePreprocessing({
                                        type: 'step',
                                        step: 'middle',
                                    })
                                }
                                if (feature === 'spline') {
                                    series.setCurvePreprocessing({
                                        type: 'spline',
                                        resolution: 20,
                                    })
                                }
                                if (feature === 'line' || feature === 'area' || feature === 'step' || feature === 'spline') {
                                    series.setStrokeStyle((stroke) => stroke.setThickness(2))
                                } else {
                                    series.setStrokeStyle(emptyLine)
                                }
                                if (feature !== 'scatter') series.setPointFillStyle(emptyFill)
                                else series.setPointSize(3)
                                if (feature !== 'area') series.setAreaFillStyle(emptyFill)
                                seriesList.push(series)
                            }

                            const runAppendPerformanceTest = () => {
                                return new Promise((resolve) => {
                                    const tStart = window.performance.now()
                                    let frameCount = 0
                                    let iSample = 0
                                    let x = dataSetSize
                                    let tPrev = window.performance.now()

                                    axisXBottom.setStopped(false).setScrollStrategy(AxisScrollStrategies.scrolling)

                                    const frame = () => {
                                        frameCount += 1
                                        const t = window.performance.now()
                                        const d = t - tPrev
                                        tPrev = t
                                        const appendDataPointCount = Math.round((appendPointsPerSecond * d) / 1000)

                                        // Append data implementation for LCJS
                                        const dataAppendX = new Float64Array(appendDataPointCount)
                                        const dataAppend = new Array(channels).fill(0).map(() => new Float32Array(appendDataPointCount))
                                        for (let i = 0; i < appendDataPointCount; i += 1) {
                                            x += 1
                                            iSample = (iSample + 1) % dataSetSize
                                            dataAppendX[i] = x
                                            for (let ch = 0; ch < channels; ch += 1) {
                                                dataAppend[ch][i] = dataSetsY[ch][iSample]
                                            }
                                        }
                                        dataSet.appendSamples({
                                            x: dataAppendX,
                                            ...Object.fromEntries(new Array(channels).fill(0).map((_, i) => [`y${i}`, dataAppend[i]])),
                                        })
                                        //

                                        if (t - tStart > appendTestDurationMs && window.appendTestFinished) {
                                            const fps = (1000 * frameCount) / (t - tStart)
                                            window.appendTestFinished(window.performance.now(), fps)
                                            resolve()
                                        } else {
                                            requestAnimationFrame(frame)
                                        }
                                    }
                                    requestAnimationFrame(frame)
                                })
                            }

                            let loaded = false
                            let dataInputComplete = !maxCapacityTest
                            const renderWaiters = []
                            const waitUntilRendered = () =>
                                new Promise((resolve) => {
                                    renderWaiters.push(resolve)
                                })
                            const finishLoadingTest = async () => {
                                if (loaded) return
                                loaded = true
                                // Wait for Puppeteer to capture the post-load metrics before signalling completion.
                                // This used to be accidentally provided by the fixed 500 ms delay below.
                                await window.loadingTestFinished(window.testStart, window.performance.now())
                                if (!disableTimeouts) {
                                    await new Promise((resolve) => setTimeout(resolve, 500))
                                }
                                if (maxCapacityTest || appendTestDurationMs === 0) {
                                    window.appendTestFinished(window.performance.now(), -1)
                                } else {
                                    await runAppendPerformanceTest()
                                }
                            }
                            chart.engine.addEventListener('renderframe', async (event) => {
                                if (!event.asyncRenderingPending) {
                                    renderWaiters.splice(0).forEach((resolve) => resolve())
                                    if (dataInputComplete) {
                                        await finishLoadingTest()
                                    }
                                }
                            })

                            const runMaxCapacityDataInput = async () => {
                                const previousYValues = new Array(channels).fill(0)
                                for (let start = 0; start < dataSetSize; start += maxCapacityChunkSize) {
                                    const count = Math.min(maxCapacityChunkSize, dataSetSize - start)
                                    const chunk = createDataChunk(start, count, previousYValues)
                                    dataSet.appendSamples(createAppendSamples(chunk.xs, chunk.ys))
                                    await waitUntilRendered()
                                    if (window.maxCapacityInputProgress) {
                                        window.maxCapacityInputProgress(start + count)
                                    }
                                }
                                dataInputComplete = true
                                await finishLoadingTest()
                            }

                            if (maxCapacityTest) {
                                runMaxCapacityDataInput().catch((error) => {
                                    console.error(error)
                                    if (window.error) window.error()
                                })
                            }
                        }

                        window.testReadyToBegin()
                    },
                )
        </script>
    </body>
</html>
