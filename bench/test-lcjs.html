<html>
    <head>
        <script src="lcjs.iife.js"></script>
        <style>
            body {
                margin: 0px;
            }

            #chart {
                width: 100vw;
                height: 100vh;
            }
        </style>
    </head>

    <body>
        <div id="chart"></div>
        <script src="common.js"></script>
        <script>
            const container = document.getElementById('chart')
            const {
                lightningChart,
                Themes,
                disableThemeEffects,
                AxisTickStrategies,
                SolidFill,
                ColorRGBA,
                AxisScrollStrategies,
                emptyLine,
                emptyFill,
                emptyTick,
                DataSetXY,
            } = lcjs

            window.testSetup().then(({ channels, dataSetSize, appendPointsPerSecond, testAppend, appendTestDurationMs, feature }) => {
                const xs = new Float64Array(new SharedArrayBuffer(dataSetSize * Float64Array.BYTES_PER_ELEMENT))
                for (let i = 0; i < dataSetSize; i += 1) {
                    xs[i] = i
                }
                const dataSetsY = new Array(channels).fill(0).map((_, ch) => {
                    const ys = new Float32Array(new SharedArrayBuffer(dataSetSize * Float32Array.BYTES_PER_ELEMENT))
                    let prev = 0
                    for (let i = 0; i < dataSetSize; i += 1) {
                        const next = prev + Math.random() * 2 - 1
                        prev = next
                        ys[i] = next
                    }
                    return ys
                })

                const theme = {
                    ...Themes.darkGold,
                    effect: undefined,
                    xAxisNumericTicks: Themes.darkGold.xAxisNumericTicks.setMinorTickStyle(emptyTick),
                    yAxisNumericTicks: Themes.darkGold.yAxisNumericTicks.setMinorTickStyle(emptyTick),
                }

                window.testPerform = () => {
                    // loading speed test
                    const lc = lightningChart({
                        // Put license key here to test locally
                        webWorkers: {
                            maxWorkers: appendPointsPerSecond > 0 && appendTestDurationMs > 0 ? 0 : undefined,
                        },
                    })

                    const chart = lc
                        .ChartXY({
                            animationsEnabled: false,
                            theme,
                            container,
                            interactable: false,
                            legend: { visible: false },
                        })
                        .setTitle('')

                    const axisXBottom = chart.getDefaultAxisX().setInterval({ start: 0, end: dataSetSize })

                    const dataSet = new DataSetXY({
                        includesNaN: false,
                        useSharedArrayBuffers: true,
                        schema: {
                            x: {
                                pattern: feature === 'scatter' ? null : 'progressive',
                                storage: Float64Array,
                                ensureNoDuplication: true,
                            },
                            ...Object.fromEntries(
                                new Array(channels).fill(0).map((_, i) => [
                                    `y${i}`,
                                    {
                                        pattern: null,
                                        storage: Float32Array,
                                        ensureNoDuplication: true,
                                    },
                                ]),
                            ),
                        },
                    })
                        .setMaxSampleCount(dataSetSize)
                        .appendSamples({
                            x: xs,
                            ...Object.fromEntries(new Array(channels).fill(0).map((_, i) => [`y${i}`, dataSetsY[i]])),
                        })
                    const seriesList = []
                    for (let i = 0; i < channels; i += 1) {
                        const series = chart.addPointLineAreaSeries().setPointStrokeStyle(emptyLine)
                        series.setDataSet(dataSet, { x: 'x', y: `y${i}` })
                        if (feature === 'step') {
                            series.setCurvePreprocessing({
                                type: 'step',
                                step: 'middle',
                            })
                        }
                        if (feature === 'spline') {
                            series.setCurvePreprocessing({
                                type: 'spline',
                                resolution: 20,
                            })
                        }
                        if (feature === 'line' || feature === 'area' || feature === 'step' || feature === 'spline') {
                            series.setStrokeStyle((stroke) => stroke.setThickness(2))
                        } else {
                            series.setStrokeStyle(emptyLine)
                        }
                        if (feature !== 'scatter') series.setPointFillStyle(emptyFill)
                        else series.setPointSize(3)
                        if (feature !== 'area') series.setAreaFillStyle(emptyFill)
                        seriesList.push(series)
                    }

                    const runAppendPerformanceTest = () => {
                        return new Promise((resolve) => {
                            const tStart = window.performance.now()
                            let frameCount = 0
                            let iSample = 0
                            let x = dataSetSize
                            let tPrev = window.performance.now()

                            axisXBottom.setStopped(false).setScrollStrategy(AxisScrollStrategies.scrolling)

                            const frame = () => {
                                frameCount += 1
                                const t = window.performance.now()
                                const d = t - tPrev
                                tPrev = t
                                const appendDataPointCount = Math.round((appendPointsPerSecond * d) / 1000)

                                // Append data implementation for LCJS
                                const dataAppendX = new Float64Array(appendDataPointCount)
                                const dataAppend = new Array(channels).fill(0).map(() => new Float32Array(appendDataPointCount))
                                for (let i = 0; i < appendDataPointCount; i += 1) {
                                    x += 1
                                    iSample = (iSample + 1) % dataSetSize
                                    dataAppendX[i] = x
                                    for (let ch = 0; ch < channels; ch += 1) {
                                        dataAppend[ch][i] = dataSetsY[ch][iSample]
                                    }
                                }
                                dataSet.appendSamples({
                                    x: dataAppendX,
                                    ...Object.fromEntries(new Array(channels).fill(0).map((_, i) => [`y${i}`, dataAppend[i]])),
                                })
                                //

                                if (t - tStart > appendTestDurationMs && window.appendTestFinished) {
                                    const fps = (1000 * frameCount) / (t - tStart)
                                    window.appendTestFinished(window.performance.now(), fps)
                                    resolve()
                                } else {
                                    requestAnimationFrame(frame)
                                }
                            }
                            requestAnimationFrame(frame)
                        })
                    }

                    let loaded = false
                    chart.engine.addEventListener('renderframe', async (event) => {
                        if (!event.asyncRenderingPending && !loaded) {
                            loaded = true
                            window.loadingTestFinished(window.testStart, window.performance.now())
                            await new Promise((resolve) => setTimeout(resolve, 500))
                            if (appendTestDurationMs === 0) {
                                window.appendTestFinished(window.performance.now(), -1)
                            } else {
                                await runAppendPerformanceTest()
                            }
                        }
                    })
                }

                window.testReadyToBegin()
            })
        </script>
    </body>
</html>
